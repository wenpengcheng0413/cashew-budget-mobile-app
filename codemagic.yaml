workflows:
  ios-sideload-build:
    name: iOS Sideload IPA Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    working_directory: budget
    environment:
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
      tag_patterns:
        - pattern: ios-v*
          include: true
    scripts:
      - name: Clean workspace and stale CocoaPods lock
        script: |
          flutter clean
          rm -f ios/Podfile.lock
          rm -rf ios/Pods
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Run build_runner for drift database
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Update CocoaPods specs repo
        script: pod repo update
      - name: Build iOS Archive
        script: flutter build ipa --release --no-codesign
      - name: Package unsigned IPA from archive
        script: |
          mkdir -p Payload
          cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app Payload/
          zip -qr build/ios/ipa/Runner.ipa Payload
          rm -rf Payload
    artifacts:
      - budget/build/ios/ipa/Runner.ipa
      - budget/build/ios/archive/Runner.xcarchive
